media:
  - name: default
    label: Images
    input: public/images
    output: /images
  - name: landing-images
    label: Landing Images
    input: src/assets/images
    output: /images

content:
  - name: landing
    label: Landing Pages
    type: collection
    path: src/content/landing
    format: json
    filename: "{primary}.json"
    view:
      primary: header.title
      fields:
        - header.title
        - header.subtitle
    fields:
      - name: seo
        label: SEO (Google title & snippet)
        type: object
        required: false
        fields:
          - name: title
            label: Search engine title
            type: string
            required: false
            description: 'Shown as the clickable title in Google results (aim for ~50-60 characters). Leave empty to use the site default, "Genevieve Navisotschnig | CultureWithGen".'
          - name: description
            label: Search engine snippet
            type: text
            required: false
            description: "The grey summary text under the title in Google results (aim for ~150-160 characters). Leave empty to use the site's default description."
      - name: nav
        label: Top menu links
        type: object
        required: false
        description: "Wording of the links in the top menu. These jump to the sections below, so if you rename a section heading you can match its menu link here. Leave a field empty to keep the default wording."
        fields:
          - name: services
            label: Link to the "What I offer" section
            type: string
            required: false
          - name: about
            label: Link to the "About" section
            type: string
            required: false
          - name: workshops
            label: Link to the "Workshop Formats" section
            type: string
            required: false
          - name: testimonials
            label: Link to the testimonials section
            type: string
            required: false
      - name: header
        label: Header / First Impression
        type: object
        fields:
          - name: eyebrow
            label: Eyebrow (small label above the title)
            type: string
            required: false
          - name: title
            type: string
          - name: subtitle
            type: string
          - name: description
            label: Description (rich text)
            type: rich-text
            options:
              format: html
              switcher: false
          - name: ctaLabel
            label: Call-to-action button label
            type: string
            description: "Used by all three contact buttons: the one in the top menu, the one in this header, and the one in the Contact section."
          - name: image
            label: Hero image
            type: object
            required: false
            fields:
              - name: src
                label: Image
                type: image
                options:
                  media: landing-images
                required: false
              - name: alt
                label: Alt text
                type: string
                required: false
              - name: position
                label: Image crop position
                type: select
                required: false
                default: center
                options:
                  values:
                    [
                      center,
                      top,
                      bottom,
                      left,
                      right,
                      left-top,
                      right-top,
                      left-bottom,
                      right-bottom,
                    ]
                description: "Which part of the photo to keep when it is cropped to fit. Pick 'top' if heads are cut off, for example. Defaults to center."
      - name: about
        label: About
        type: object
        fields:
          - name: title
            type: string
          - name: body
            label: About text (rich text)
            type: rich-text
            options:
              format: html
              switcher: false
          - name: image
            label: Portrait image
            type: object
            required: false
            fields:
              - name: src
                label: Image
                type: image
                options:
                  media: landing-images
                required: false
              - name: alt
                label: Alt text
                type: string
                required: false
          # No crop-position picker here on purpose: the portrait renders at its
          # natural aspect ratio (h-auto / object-contain in About.astro), so it
          # is never cropped and the control would have no visible effect.
          - name: credentials
            label: Credentials
            type: object
            list: true
            fields:
              - name: icon
                label: Icon
                type: select
                options:
                  values:
                    [
                      business_center,
                      communication,
                      connect_without_contact,
                      corporate_fare,
                      diversity_3,
                      feedback,
                      forum,
                      groups,
                      handshake,
                      language,
                      location_on,
                      mail,
                      military_tech,
                      psychology,
                      record_voice_over,
                      schedule,
                      school,
                      support_agent,
                      videocam,
                      workspace_premium,
                    ]
                description: "Pick a supported icon. Adding a new one requires a developer to register its SVG in src/components/icons.ts and add the name here."
              - name: text
                type: string
                required: true
      - name: offer
        label: What I Offer
        type: object
        fields:
          - name: title
            type: string
          - name: subtitle
            type: string
            required: false
          - name: items
            type: object
            list: true
            fields:
              - name: icon
                label: Icon
                type: select
                options:
                  values:
                    [
                      business_center,
                      communication,
                      connect_without_contact,
                      corporate_fare,
                      diversity_3,
                      feedback,
                      forum,
                      groups,
                      handshake,
                      language,
                      location_on,
                      mail,
                      military_tech,
                      psychology,
                      record_voice_over,
                      schedule,
                      school,
                      support_agent,
                      videocam,
                      workspace_premium,
                    ]
                description: "Pick a supported icon. Adding a new one requires a developer to register its SVG in src/components/icons.ts and add the name here."
              - name: text
                type: string
                required: true
      - name: whoFor
        label: Who This Is For
        type: object
        fields:
          - name: title
            type: string
          - name: items
            type: object
            list: true
            fields:
              - name: icon
                label: Icon
                type: select
                options:
                  values:
                    [
                      business_center,
                      communication,
                      connect_without_contact,
                      corporate_fare,
                      diversity_3,
                      feedback,
                      forum,
                      groups,
                      handshake,
                      language,
                      location_on,
                      mail,
                      military_tech,
                      psychology,
                      record_voice_over,
                      schedule,
                      school,
                      support_agent,
                      videocam,
                      workspace_premium,
                    ]
                description: "Pick a supported icon. Adding a new one requires a developer to register its SVG in src/components/icons.ts and add the name here."
              - name: text
                type: string
                required: true
      - name: situations
        label: Typical Situations
        type: object
        fields:
          - name: title
            type: string
          - name: items
            type: object
            list: true
            fields:
              - name: icon
                label: Icon
                type: select
                options:
                  values:
                    [
                      business_center,
                      communication,
                      connect_without_contact,
                      corporate_fare,
                      diversity_3,
                      feedback,
                      forum,
                      groups,
                      handshake,
                      language,
                      location_on,
                      mail,
                      military_tech,
                      psychology,
                      record_voice_over,
                      schedule,
                      school,
                      support_agent,
                      videocam,
                      workspace_premium,
                    ]
                description: "Pick a supported icon. Adding a new one requires a developer to register its SVG in src/components/icons.ts and add the name here."
              - name: text
                type: string
                required: true
      - name: format
        label: Formats
        type: object
        fields:
          - name: title
            type: string
          - name: items
            type: object
            list: true
            fields:
              - name: icon
                label: Icon
                type: select
                options:
                  values:
                    [
                      business_center,
                      communication,
                      connect_without_contact,
                      corporate_fare,
                      diversity_3,
                      feedback,
                      forum,
                      groups,
                      handshake,
                      language,
                      location_on,
                      mail,
                      military_tech,
                      psychology,
                      record_voice_over,
                      schedule,
                      school,
                      support_agent,
                      videocam,
                      workspace_premium,
                    ]
                description: "Pick a supported icon. Adding a new one requires a developer to register its SVG in src/components/icons.ts and add the name here."
              - name: text
                type: string
                required: true
              - name: description
                label: Expanding sentence
                type: string
                required: false
                description: "One sentence expanding on this workshop format."
      - name: testimonials
        label: Testimonials
        type: object
        required: false
        fields:
          - name: visible
            label: Show testimonials section
            type: boolean
            default: true
            description: "Turn off to temporarily hide the whole testimonials section from the site without deleting its content."
          - name: title
            type: string
          - name: items
            label: Testimonials
            type: object
            list: true
            fields:
              - name: quote
                label: Quote (rich text)
                type: rich-text
                options:
                  format: html
                  switcher: false
              - name: name
                type: string
                required: true
              - name: image
                label: Photo (optional, shown as a circle)
                type: object
                required: false
                fields:
                  - name: src
                    label: Image
                    type: image
                    options:
                      media: landing-images
                    required: false
                  - name: alt
                    label: Alt text
                    type: string
                    required: false
                  - name: position
                    label: Photo crop position
                    type: select
                    required: false
                    default: center
                    options:
                      values:
                        [
                          center,
                          top,
                          bottom,
                          left,
                          right,
                          left-top,
                          right-top,
                          left-bottom,
                          right-bottom,
                        ]
                    description: "Photos are cropped to a circle. Pick which part to keep if the face is cut off - e.g. 'top' when the head sits high in the frame. Defaults to center."
      - name: contact
        label: Contact
        type: object
        fields:
          - name: title
            type: string
          - name: text
            type: string
          - name: location
            type: string

  - name: legal
    label: Legal Pages
    type: collection
    path: src/content/legal
    format: yaml-frontmatter
    fields:
      - name: title
        type: string
        required: true
      - name: body
        type: rich-text
