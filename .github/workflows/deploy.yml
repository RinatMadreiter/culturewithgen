name: Deploy to GitHub Pages

# Fires on every commit to main - direct pushes, merged PRs, and Pages CMS
# edits alike (the CMS commits via its own GitHub App token, so its commits
# trigger push events like any other).
on:
  push:
    branches: [main]
  workflow_dispatch: # manual "deploy now" button as fallback

# Permissions are granted per job, NOT here, deliberately. A workflow-level
# block is inherited by every job, which meant `test` - the job that installs
# Chromium and executes the whole transitive dependency tree - held
# `id-token: write` and could mint an OIDC token. Only `deploy` needs that.
permissions: {}

# Rapid successive CMS edits: newest push wins, stale builds are cancelled.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Gate the deploy on type-checking and formatting so errors or drift never
  # reach production. Uses first-party actions + built-in corepack (no new deps).
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # nothing else: this job only reads and validates source
    steps:
      # SHA-pinned so a re-pointed tag can't inject code (immutable commits).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # this job never pushes
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24 # active LTS; matches package.json engines
      # Corepack downloads the pnpm tarball from the npm registry on every run,
      # and that download is flaky: every one of the 13 CI failures between
      # 7-9 Aug was the same crash, an undici parser assertion on an abrupt
      # connection close. Retried rather than swapped for a third-party action,
      # because corepack ships with Node and verifies the tarball signature.
      - name: Enable pnpm
        run: |
          for i in 1 2 3; do
            corepack enable && exit 0
            echo "corepack attempt $i failed; retrying in $((i * 5))s"
            sleep $((i * 5))
          done
          echo "corepack failed after 3 attempts" >&2
          exit 1
      - run: pnpm install --frozen-lockfile
      # Runs before astro check: it is faster, and its message names the exact
      # drifting field instead of a generic InvalidContentEntryDataError.
      - run: pnpm check:schema
      - run: pnpm astro check
      - run: pnpm format:check

  # The e2e suite gates the deploy. Runs in parallel with `check` rather than
  # after it, so the two slowest gates overlap instead of queueing.
  # Chromium only: this blocks every deploy, and this repo has already hit Pages
  # deploy-lock contention, so the gate is kept deliberately fast. The webkit and
  # mobile-safari projects in playwright.config.ts are for local runs.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # runs third-party code; must not hold pages or id-token
    steps:
      # SHA-pinned so a re-pointed tag can't inject code (immutable commits).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # this job never pushes
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24 # active LTS; matches package.json engines
      # See the note in `check`: retried because corepack's download is flaky.
      - name: Enable pnpm
        run: |
          for i in 1 2 3; do
            corepack enable && exit 0
            echo "corepack attempt $i failed; retrying in $((i * 5))s"
            sleep $((i * 5))
          done
          echo "corepack failed after 3 attempts" >&2
          exit 1
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      # playwright.config.ts builds the site and serves it with `astro preview`.
      - run: pnpm test
      # The HTML report is the only way to diagnose a CI-only failure after the
      # runner is gone; traces and screenshots are attached to it on failure.
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  build:
    needs: [check, test]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write # withastro/action uploads the Pages artifact
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # SHA-pinned so a compromised upstream tag can't inject code.
      - uses: withastro/action@e84f40bd8d2caa9e768ec82ad30dd81f0b280853 # v6.1.2
        with:
          node-version: 24 # active LTS; matches package.json engines

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # The only job that needs these. deploy-pages checks out nothing, so it
    # gets no `contents` access at all.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
        with:
          timeout: 600000
